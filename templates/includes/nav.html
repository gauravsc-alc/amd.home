<nav class="nav" id="nav" aria-label="Main navigation">
  <div class="nav__inner">
    <a href="index.html" class="nav__logo" aria-label="{{ config.full_name }} home">
      <span class="nav__logo-main">AMD</span>
      <span class="nav__logo-sub">{{ config.full_name }}</span>
    </a>
    <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-controls="navLinks" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav__links" id="navLinks">
{% for item in navigation %}
      <li><a href="{{ item.filename }}"{% if item.key == current_page %} aria-current="page"{% endif %}{% if item.key == 'contact' %} class="nav__cta"{% endif %}>{{ item.label }}</a></li>
{% endfor %}
    </ul>
  </div>
  <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
</nav>
