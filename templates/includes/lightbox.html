<!-- Lightbox — opened by static/js/main.js when a portfolio item is clicked -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true" tabindex="-1">
  <button class="lightbox__close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox__prev"  id="lightboxPrev"  aria-label="Previous">&#8592;</button>
  <button class="lightbox__next"  id="lightboxNext"  aria-label="Next">&#8594;</button>
  <div class="lightbox__inner">
    <img id="lightboxImg" alt="" />
    <p id="lightboxCaption" class="lightbox__caption" aria-live="polite"></p>
  </div>
</div>
