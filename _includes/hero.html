<section class="hero" id="hero">

  <img
    src="{{ site.hero.image | relative_url }}"
    alt="{{ site.title }} — hero image"
    class="hero__bg"
  />

  <div class="hero__overlay"></div>

  <div class="hero__content">
    <p class="hero__eyebrow">{{ site.hero.eyebrow }}</p>
    <h1 class="hero__title">{{ site.hero.title | newline_to_br }}</h1>
    <p class="hero__sub">{{ site.hero.subtitle }}</p>
    <div class="hero__actions">
      <a href="#portfolio" class="btn btn--primary">{{ site.hero.cta_primary }}</a>
      <a href="#contact"   class="btn btn--ghost">{{ site.hero.cta_secondary }}</a>
    </div>
  </div>

  <div class="hero__scroll-hint" aria-hidden="true">
    <span>Scroll</span>
    <div class="hero__scroll-line"></div>
  </div>

</section>
