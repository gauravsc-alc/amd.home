<footer class="footer">
  <div class="container">
    <div class="footer__inner">
      <div class="footer__brand">
        <span class="footer__logo">AMD — {{ config.full_name }}</span>
        <p>{{ config.footer.tagline }}</p>
      </div>
      <nav class="footer__links" aria-label="Footer navigation">
        <a href="#expertise">Services</a>
        {% if config.portfolio.enabled != False %}<a href="#portfolio">Portfolio</a>{% endif %}
        <a href="#process">Process</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="footer__social" aria-label="Social profiles">
{% for name, url in config.social.items %}
{% if url and url != '#' %}
        <a href="{{ url }}" class="social-btn social-btn--footer" aria-label="{{ name|title }}" title="{{ name|title }}">
          <i class="fa-brands {% if name == 'twitter' %}fa-x-twitter{% else %}fa-{{ name }}{% endif %}" aria-hidden="true"></i>
          <span class="visually-hidden">{{ name|title }}</span>
        </a>
{% endif %}
{% endfor %}
      </div>
    </div>
    <p class="footer__copy">&copy; {{ config.footer.copy }}</p>
  </div>
</footer>
